<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .calculator {
            background: #fff;
            padding: 24px 20px;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
            width: 320px;
            box-sizing: border-box;
        }
        .display {
            width: 100%;
            height: 48px;
            font-size: 2em;
            text-align: right;
            margin-bottom: 16px;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 6px;
            background: #f9f9f9;
            box-sizing: border-box;
        }
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            width: 100%;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            aspect-ratio: 1/1;
            font-size: 1.2em;
            border: none;
            border-radius: 6px;
            background: #e0e0e0;
            cursor: pointer;
            transition: background 0.2s;
            box-sizing: border-box;
        }
        button:active {
            background: #bdbdbd;
        }
        .operator {
            background: #ffd54f;
        }
        .equals {
            background: #4caf50;
            color: #fff;
        }
    </style>
</head>
<script src="main.js"></script>
<body>
    
    <div class="calculator">
        <input type="text" class="display" id="display" disabled>
        <div class="buttons">
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button class="operator">÷</button>
            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button class="operator">×</button>
            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button class="operator">−</button>
            <button>0</button>
            <button class="clear">C</button>
            <button class="equals">=</button>
            <button class="operator">+</button>
        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>
