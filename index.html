<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Work</title>
    <style>
        body {
            background: linear-gradient(135deg, #89f7fe 0%, #66a6ff 100%);
            min-height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .game-card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(102,166,255,0.15);
            padding: 32px 40px;
            text-align: center;
            min-width: 320px;
        }
        h1 {
            color: #3578e5;
            margin-bottom: 24px;
            font-size: 2rem;
            letter-spacing: 1px;
        }
        #guessInput {
            padding: 10px 16px;
            font-size: 1.1rem;
            border: 2px solid #66a6ff;
            border-radius: 8px;
            outline: none;
            margin-bottom: 16px;
            width: 70%;
            transition: border-color 0.2s;
        }
        #guessInput:focus {
            border-color: #3578e5;
        }
        #guessBtn {
            padding: 10px 24px;
            font-size: 1.1rem;
            background: #66a6ff;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-left: 8px;
            transition: background 0.2s;
        }
        #guessBtn:hover {
            background: #3578e5;
        }
        #tip {
            margin-top: 20px;
            font-size: 1.2rem;
            color: #3578e5;
            min-height: 24px;
        }
    </style>
</head>

<body>
    
    <div class="game-card">
        <h1>Guess the Number Game</h1>
        <input class = "display"type="number" id="guessInput" placeholder="Enter your guess">
        <button onclick="checkGuess()" id="guessBtn">Guess</button>
        <p id="tip"></p>
    </div>
    <script src="main.js"></script>
</body>
</html>
